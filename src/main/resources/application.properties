# ===== 应用基础配置 =====
spring.application.name=javaweb

# 内嵌 Tomcat 端口
server.port=8080
# 统一字符编码，避免中文乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ===== 数据源（JDBC）=====
# 这几个值会被 JdbcConfig 用 @Value 注入到 JDBC 六步流程里
jdbc.driver-class-name=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/jdbc_demo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
jdbc.username=root
jdbc.password=123456

# ===== JSON 序列化 =====
# 让返回的 JSON 带缩进，浏览器里好读；日期统一格式
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# ===== 日志 =====
logging.level.root=INFO
logging.level.com.example.javaweb=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n

# ===== 热部署 =====
# 只要类路径下文件变化就重启（配合 VS Code 保存自动触发）
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
